name: Enrich Tool Assets

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "tools/*.md"
  pull_request_review:
    types:
      - submitted

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: enrich-tool-assets-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enrich:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      GH_TOKEN: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout automation scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: automation

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Install automation dependencies
        run: npm ci
        working-directory: automation

      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          allow-unsafe-pr-checkout: true
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base commit
        run: |
          git -C pr remote add upstream "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C pr fetch --no-tags --depth=1 upstream "${PR_BASE_SHA}"

      - name: Check review decision
        id: review-decision
        run: |
          decision=$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json reviewDecision --jq .reviewDecision)
          echo "decision=${decision}" >> "$GITHUB_OUTPUT"

      - name: List changed tools
        id: changed-tools
        run: |
          node automation/scripts/list-changed-tools.mjs pr "${PR_BASE_SHA}" "${PR_HEAD_SHA}" > /tmp/changed-tools.json
          cat /tmp/changed-tools.json
          {
            echo "json=$(cat /tmp/changed-tools.json)"
          } >> "$GITHUB_OUTPUT"

      - name: List tool submitter changes
        id: submitter-tools
        run: |
          node automation/scripts/list-changed-tools.mjs pr "${PR_BASE_SHA}" "${PR_HEAD_SHA}" --include-deleted > /tmp/submitter-tools.json
          cat /tmp/submitter-tools.json
          {
            echo "json=$(cat /tmp/submitter-tools.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Sync tool submitters
        if: ${{ steps.submitter-tools.outputs.json != '[]' }}
        env:
          TOOL_SLUGS_JSON: ${{ steps.submitter-tools.outputs.json }}
        run: |
          mapfile -t TOOL_SLUGS < <(node -e 'const slugs = JSON.parse(process.argv[1]); for (const slug of slugs) console.log(slug);' "${TOOL_SLUGS_JSON}")
          ARGS=(automation/scripts/sync-tool-submitters.mjs --root-dir pr --base-root-dir automation --submitted-by "${PR_AUTHOR}")
          for slug in "${TOOL_SLUGS[@]}"; do
            ARGS+=(--slug "$slug")
          done
          node "${ARGS[@]}"

      - name: Enrich changed tool files
        if: ${{ steps.review-decision.outputs.decision == 'APPROVED' && steps.changed-tools.outputs.json != '[]' }}
        env:
          TOOL_SLUGS_JSON: ${{ steps.changed-tools.outputs.json }}
        run: |
          mapfile -t TOOL_SLUGS < <(node -e 'const slugs = JSON.parse(process.argv[1]); for (const slug of slugs) console.log(slug);' "${TOOL_SLUGS_JSON}")
          ARGS=(automation/scripts/enrich-tool-assets.mjs --write --root-dir pr)
          for slug in "${TOOL_SLUGS[@]}"; do
            ARGS+=(--slug "$slug")
          done
          node "${ARGS[@]}"

      - name: Validate PR content
        if: ${{ steps.review-decision.outputs.decision == 'APPROVED' && steps.changed-tools.outputs.json != '[]' }}
        run: node automation/scripts/validate-content.mjs pr --require-submitters

      - name: Check for tool file changes
        if: ${{ steps.submitter-tools.outputs.json != '[]' }}
        id: tool-diff
        run: |
          if git -C pr diff --quiet -- tools tool-submitters.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit enrichment to PR branch
        if: ${{ steps.tool-diff.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git -C pr config user.name "github-actions[bot]"
          git -C pr config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pr add tools tool-submitters.json
          git -C pr commit -m "Auto-fill tool media and submitter metadata"
          git -C pr remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${PR_HEAD_REPO}.git"
          git -C pr push origin "HEAD:${PR_HEAD_REF}"

      - name: Comment when fork PR needs enrichment
        if: ${{ steps.tool-diff.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name != github.repository }}
        env:
          CHANGED_TOOLS_JSON: ${{ steps.changed-tools.outputs.json }}
          SUBMITTER_TOOLS_JSON: ${{ steps.submitter-tools.outputs.json }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const shellQuote = (value) => `'${value.replaceAll("'", `'"'"'`)}'`;
          const flags = (json) => JSON.parse(json).map((slug) => `--slug ${shellQuote(slug)}`).join(" ");
          const baseRoot = `../agentfirst-base-${process.env.PR_NUMBER}`;
          const upstreamUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}.git`;
          const submitterFlags = flags(process.env.SUBMITTER_TOOLS_JSON);
          const enrichmentFlags = flags(process.env.CHANGED_TOOLS_JSON);
          const enrichmentCommand = enrichmentFlags
            ? `npm run enrich:tool-assets -- --write ${enrichmentFlags}\n`
            : "";
          const body = `I found missing media metadata and/or repo-managed submitter metadata that should be written back to the PR branch. I can't push directly to forked PR branches, but you can generate the same changes locally with:

          \`\`\`bash
          git fetch ${shellQuote(upstreamUrl)} ${shellQuote(process.env.PR_BASE_SHA)}
          git worktree add --detach ${shellQuote(baseRoot)} FETCH_HEAD
          npm run sync:tool-submitters -- --base-root-dir ${shellQuote(baseRoot)} --submitted-by ${shellQuote(process.env.PR_AUTHOR)} ${submitterFlags}
          ${enrichmentCommand}git worktree remove ${shellQuote(baseRoot)}
          \`\`\`

          Then commit the updated files to this PR branch.`;
          writeFileSync("/tmp/enrichment-comment.md", body);
          NODE
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/enrichment-comment.md

      - name: Require fork PR enrichment changes
        if: ${{ steps.tool-diff.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::Commit the generated enrichment and submitter metadata changes to the fork PR branch."
          exit 1
