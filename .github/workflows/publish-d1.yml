name: Publish D1

on:
  push:
    branches:
      - main
    paths:
      - "categories/**"
      - "redirects.json"
      - "tool-submitters.json"
      - "tools/**"
  workflow_dispatch:
    inputs:
      run_purge:
        description: Purge Cloudflare cache after a successful D1 sync
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-d1-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      GITHUB_SHA: ${{ github.sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate content
        run: npm run validate:content

      - name: Render Wrangler config
        run: node ./scripts/render-wrangler-config.mjs /tmp/agentfirst-wrangler.jsonc

      - name: Apply migrations
        run: npx wrangler d1 migrations apply "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config /tmp/agentfirst-wrangler.jsonc

      - name: Generate ordered sync SQL batches
        run: npm run sync:d1:batches -- /tmp/agentfirst-d1-sync-batches

      - name: Sync D1 data
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          batch_files=(/tmp/agentfirst-d1-sync-batches/batch-*.sql)

          if (( ${#batch_files[@]} == 0 )); then
            echo "No generated D1 sync batches were found." >&2
            exit 1
          fi

          for batch_file in "${batch_files[@]}"; do
            echo "Applying $(basename "$batch_file")"
            npx wrangler d1 execute "$CLOUDFLARE_D1_DATABASE_NAME" --remote --file "$batch_file" --config /tmp/agentfirst-wrangler.jsonc
          done

      - name: Compute purge URLs
        if: ${{ github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.run_purge) }}
        run: node ./scripts/compute-purge-urls.mjs /tmp/agentfirst-purge-urls.json

      - name: Purge Cloudflare cache
        if: ${{ github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.run_purge) }}
        run: node ./scripts/purge-cloudflare-cache.mjs /tmp/agentfirst-purge-urls.json

      - name: Submit changed URLs to IndexNow
        if: ${{ github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.run_purge) }}
        continue-on-error: true
        run: node ./scripts/submit-indexnow.mjs /tmp/agentfirst-purge-urls.json
